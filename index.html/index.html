<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEXORA | Wear Different. Be Vexora.</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* LAYER 1: Background Video */
    .bg-video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.2;
      filter: blur(2px) contrast(1.1);
    }

    /* LAYER 2: Floating Animated Jackets (Multi-layered Depth Grid) */
    .bg-jackets-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-jacket {
      position: absolute;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      animation: floatFall linear infinite;
    }

    /* Small/Far jackets */
    .bg-jacket.sm {
      width: 130px;
      height: 180px;
      opacity: 0.18;
      filter: blur(4px);
    }

    /* Medium jackets */
    .bg-jacket.md {
      width: 170px;
      height: 230px;
      opacity: 0.25;
      filter: blur(2px);
    }

    /* Large/Close jackets */
    .bg-jacket.lg {
      width: 210px;
      height: 280px;
      opacity: 0.35;
      filter: blur(1px);
    }

    @keyframes floatFall {
      0% {
        transform: translateY(-300px) rotate(0deg) scale(0.85);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) scale(1.05);
      }
      100% {
        transform: translateY(115vh) rotate(360deg) scale(0.85);
      }
    }

    /* LAYER 3: Dark Overlay Gradient */
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(5,5,5,0.15) 0%, rgba(5,5,5,0.92) 85%);
      z-index: 3;
    }

    /* LAYER 4: Foreground Hero Layer */
    .hero-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .title-wrapper {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
    }

    /* Zoom-Spin & Golden Glow Entrance */
    .letter {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.5rem, 9.5vw, 9rem);
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      display: inline-block;
      opacity: 0;
      transform: scale(0.2) rotate(-15deg);
      animation: dynamicEntrance 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 goldGlow 2.5s ease-in-out infinite alternate 2s;
    }

    /* Staggered Timings for V-E-X-O-R-A */
    .letter:nth-child(1) { animation-delay: 0.5s, 1s; }
    .letter:nth-child(2) { animation-delay: 0.5s, 1s; }
    .letter:nth-child(3) { animation-delay: 0.5s, 1s; }
    .letter:nth-child(4) { animation-delay: 0.5s, 1s; }
    .letter:nth-child(5) { animation-delay: 0.5s, 1s; }
    .letter:nth-child(6) { animation-delay: 0.5s, 1s; }

    @keyframes dynamicEntrance {
      0% {
        opacity: 0;
        transform: scale(0.1) translatex(-100px) rotate(-20deg);
        filter: blur(10px);
      }
      70% {
        opacity: 1;
        transform: scale(1.15) translateY(10px) rotate(3deg);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
        filter: blur(0px);
      }
    }

    @keyframes goldGlow {
      0% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 20px rgba(247, 244, 234, 0.2);
      }
      50% {
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 45px rgba(246, 245, 240, 0.8), 0 0 70px rgba(212, 175, 55, 0.5);
      }
      100% {
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 30px rgba(234, 233, 229, 0.4);
      }
    }

    /* Tagline */
    .tagline {
      font-size: clamp(0.9rem, 2.2vw, 1.3rem);
      font-weight: 600;
      letter-spacing: 8px;
      color: #f5f3ee;
      margin-bottom: 40px;
      text-transform: uppercase;
      opacity: 0;
      animation: slideUp 1s ease forwards 1.7s;
    }

    /* Shop Button */
    .shop-btn {
      display: inline-block;
      padding: 16px 48px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #050505;
      background: linear-gradient(135deg, #ffffff 0%, #f4f3f1 100%);
      border: none;
      border-radius: 2px;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      animation: slideUp 1s ease forwards 1.9s;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    }

    .shop-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 35px rgba(239, 238, 234, 0.6);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
